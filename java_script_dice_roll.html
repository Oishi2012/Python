<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roll</title>
</head>
<body style="text-align: center;">
    <div><h1>Click on the Dice</h1></div>
    <div id="dice" style="font-size: 320px;" onclick="stopStart()"></div>
    <script>
        var dices=['&#9856;', '&#9857;', '&#9858;', '&#9859;', '&#9860;', '&#9861;'];
        var stopped=true;
        var dice;
        var t;
        function change(){
            var randomNum=(Math.floor(Math.random()*6));
            dice.innerHTML=dices[randomNum];
        }
        function stopStart(){
            if(stopped){
            stopped=false;
            t=setInterval(change, 100);
            }
            else{
                clearInterval(t);
                stopped=true;
            }
        }
        window.onload=function(){
            dice=document.getElementById("dice");
            stopStart();

        }





    </script>



    
</body>
</html>
