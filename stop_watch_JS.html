<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>

    <style>
        body {
            margin: 0;
            padding: 50px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .wrapper {
            max-width: 400px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
        }

        p {
            margin: 25px 0;
            font-size: 50px;
        }

        button {
            margin: 8px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div class="wrapper">

        <h1>Stopwatch</h1>

        <p>
            <span id="seconds">00</span>:
            <span id="milliseconds">00</span>
        </p>

        <button id="button-start">Start</button>
        <button id="button-stop">Stop</button>
        <button id="button-reset">Reset</button>

    </div>


    <script>

        window.onload = function () {

            var seconds = 0;
            var milliseconds = 0;

            var appendMilliseconds =
                document.getElementById("milliseconds");

            var appendSeconds =
                document.getElementById("seconds");

            var buttonStart =
                document.getElementById("button-start");

            var buttonStop =
                document.getElementById("button-stop");

            var buttonReset =
                document.getElementById("button-reset");

            var Interval;


            buttonStart.onclick = function () {

                clearInterval(Interval);

                Interval = setInterval(startTimer, 10);

            }


            buttonStop.onclick = function () {

                clearInterval(Interval);

            }


            buttonReset.onclick = function () {

                clearInterval(Interval);

                milliseconds = "00";

                seconds = "00";

                appendMilliseconds.innerHTML = milliseconds;

                appendSeconds.innerHTML = seconds;

            }


            function startTimer() {

                milliseconds++;


                if (milliseconds <= 9) {

                    appendMilliseconds.innerHTML =
                        "0" + milliseconds;

                }


                if (milliseconds > 9) {

                    appendMilliseconds.innerHTML =
                        milliseconds;

                }


                if (milliseconds > 99) {

                    seconds++;

                    appendSeconds.innerHTML =
                        seconds;

                    milliseconds = 0;

                    appendMilliseconds.innerHTML =
                        "00";

                }


                if (seconds > 9) {

                    appendSeconds.innerHTML =
                        seconds;

                }

            }

        }

    </script>

</body>

</html>
